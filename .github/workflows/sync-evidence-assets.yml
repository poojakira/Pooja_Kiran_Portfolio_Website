name: Verify Pinned Evidence Posters

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-evidence-assets.yml"
      - "public/*poster.png"
      - "docs/POSTER_SOURCE_PINS.json"
      - "scripts/verify_poster_sources.py"
      - "scripts/test_poster_sources.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-evidence-assets.yml"
      - "public/*poster.png"
      - "docs/POSTER_SOURCE_PINS.json"
      - "scripts/verify_poster_sources.py"
      - "scripts/test_poster_sources.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Reject incomplete or mismapped source manifests
        run: python scripts/test_poster_sources.py
      - name: Verify source and portfolio poster equality without writing
        run: python scripts/verify_poster_sources.py
