name: Sync Current Evidence Posters

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-evidence-assets.yml"
      - "public/og-card.svg"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout portfolio branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch evidence-anchored poster images
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/poojakira/mcp-agent-security-gateway/d936cadde0ff4e0fb322c6600638b387b1c39d09/poster/poster.png"             -o /tmp/mcp-poster.png
          curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/poojakira/aws-agent-identity-guard/51916ac3d381579c78112233911827217304022a/poster/poster.png"             -o /tmp/iam-poster.png
          curl --fail --silent --show-error --location             "https://raw.githubusercontent.com/poojakira/hf-model-provenance-scanner/dec0c68ceb9167c7e9b4b439b1bfd006beb5c148/poster/poster.png"             -o /tmp/provenance-poster.png

      - name: Render social preview from canonical SVG
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends librsvg2-bin
          rsvg-convert -w 1200 -h 630 public/og-card.svg -o /tmp/og-card.png

      - name: Sync poster and social images to PR branch
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          sync_file() {
            src="$1"
            dest="$2"
            local_blob="$(git hash-object "$src")"
            remote_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$dest?ref=$PR_BRANCH" --jq .sha)"
            if [ "$local_blob" = "$remote_blob" ]; then
              echo "$dest already matches the pinned source poster."
              return 0
            fi
            base64 -w0 "$src" > /tmp/evidence-poster.b64
            jq -n               --arg message "build: sync current evidence poster"               --rawfile content /tmp/evidence-poster.b64               --arg sha "$remote_blob"               --arg branch "$PR_BRANCH"               '{message: $message, content: $content, sha: $sha, branch: $branch}'               > /tmp/evidence-poster-request.json
            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$dest"               --input /tmp/evidence-poster-request.json >/dev/null
          }

          sync_file /tmp/mcp-poster.png public/mcp-poster.png
          sync_file /tmp/iam-poster.png public/iam-poster.png
          sync_file /tmp/provenance-poster.png public/provenance-poster.png
          sync_file /tmp/og-card.png public/og-card.png
