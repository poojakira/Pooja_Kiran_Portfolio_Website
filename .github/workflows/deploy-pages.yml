name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Generate and verify single resume PDF
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended \
            texlive-xetex fonts-crosextra-carlito poppler-utils
          mkdir -p .resume-build
          xelatex -interaction=nonstopmode -halt-on-error \
            -output-directory=.resume-build resume/Pooja_Kiran_Security_Engineer_Resume.tex
          cp .resume-build/Pooja_Kiran_Security_Engineer_Resume.pdf public/Pooja_Kiran_Software_Engineer_Resume.pdf
          python3 scripts/verify_recruiter_claims.py
          python3 scripts/verify_resume_pdfs.py --generated-directory .resume-build
      - name: Build static site
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
