name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  production-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency audit
        run: |
          npm audit --json > audit-report.json || true
          node scripts/review-audit-report.mjs
      - name: Evidence consistency
        run: npm test
      - name: Type check
        run: npm run type-check
      - name: Lint
        run: npm run lint
      - name: Production export
        run: npm run build
      - name: Verify static export
        run: node scripts/check-export.mjs
