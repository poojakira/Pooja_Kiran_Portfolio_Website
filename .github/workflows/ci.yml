name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci
      - name: Lint Python verification scripts
        run: |
          python3 -m pip install ruff==0.8.4
          python3 -m ruff check scripts
          python3 -m ruff format --check scripts
      - name: Guard resume impact claims
        run: python3 scripts/verify_recruiter_claims.py
      - name: Type check
        run: npm run typecheck
      - name: Production build
        run: npm run build
