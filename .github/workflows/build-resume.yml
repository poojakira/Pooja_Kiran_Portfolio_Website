# Canonical resume PDF must be generated from the tracked LaTeX source.
name: Build Agentic AI Security Resume

on:
  pull_request:
    branches: [main]
    paths:
      - "resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile and validate one-page resume
        run: |
          rm -rf .resume-build
          mkdir -p .resume-build
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=.resume-build \
            resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex
          test "$(pdfinfo .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf - | \
            grep -q "MCP Agent Security Gateway"
          pdftotext .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf - | \
            grep -q "OS Resource Management Simulator"
          pdftotext .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf /tmp/resume-text.txt
          tr '\n' ' ' < /tmp/resume-text.txt | sed -E 's/[[:space:]]+/ /g' > /tmp/resume-text-normalized.txt
          grep -Fq "723 passing tests" /tmp/resume-text-normalized.txt
          grep -Fq "81.91%" /tmp/resume-text-normalized.txt
          grep -Fq "240 passing tests" /tmp/resume-text-normalized.txt
          grep -Fq "75.67%" /tmp/resume-text-normalized.txt
          ! grep -Fq "718 passing tests" /tmp/resume-text-normalized.txt
          ! grep -Fq "82.46%" /tmp/resume-text-normalized.txt
          ! grep -Fq "235 passing tests" /tmp/resume-text-normalized.txt
          ! grep -Fq "75.81%" /tmp/resume-text-normalized.txt

      - name: Sync generated PDF to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          path="public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
          generated=".resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
          pdftotext "$generated" /tmp/generated-resume.txt
          pdftotext "$path" /tmp/current-resume.txt
          if cmp -s /tmp/generated-resume.txt /tmp/current-resume.txt; then
            echo "Canonical PDF text is already current; ignoring volatile PDF metadata."
            exit 0
          fi
          cp "$generated" "$path"
          remote_blob="$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=$PR_BRANCH" --jq .sha)"
          base64 -w0 "$path" > /tmp/resume-pdf.b64
          jq -n \
            --arg message "build: regenerate canonical resume PDF" \
            --rawfile content /tmp/resume-pdf.b64 \
            --arg sha "$remote_blob" \
            --arg branch "$PR_BRANCH" \
            '{message: $message, content: $content, sha: $sha, branch: $branch}' \
            > /tmp/resume-pdf-request.json
          gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$path" \
            --input /tmp/resume-pdf-request.json >/dev/null

      - name: Upload generated PDF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: agentic-ai-security-resume
          path: public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf
