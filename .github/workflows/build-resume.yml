name: Validate Agentic AI Security Resume

on:
  push:
    branches: [main]
    paths:
      - "resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex"
      - "public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
      - "src/data/resume.ts"
  pull_request:
    branches: [main]
    paths:
      - "resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex"
      - "public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
      - "src/data/resume.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile one-page resume
        run: |
          rm -rf .resume-build
          mkdir -p .resume-build
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=.resume-build \
            resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex
          test "$(pdfinfo .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf - | \
            grep -q "MCP Agent Security Gateway"

      - name: Verify tracked PDF matches TeX source
        run: cmp .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf

      - name: Upload compiled resume evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: compiled-resume
          path: .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf
          retention-days: 14
