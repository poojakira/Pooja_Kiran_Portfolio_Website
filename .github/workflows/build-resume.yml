name: Build One-Page Software Engineer Resume
on:
  pull_request:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"
  push:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-xetex fonts-crosextra-carlito poppler-utils
          mkdir -p .resume-build
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=.resume-build resume/Pooja_Kiran_Software_Engineer_Resume.tex
          test "$(pdfinfo .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf - | grep -q "Technical Skills"
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: one-page-software-engineer-resume
          path: .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf
