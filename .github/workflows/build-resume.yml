name: Build and Validate Agentic AI Security Resume

on:
  push:
    branches: [main]
    paths:
      - "resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex"
      - "public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
      - "src/data/resume.ts"
  pull_request:
    branches: [main]
    paths:
      - "resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex"
      - "public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf"
      - "src/data/resume.ts"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-extra texlive-fonts-recommended poppler-utils

      - name: Compile one-page resume
        run: |
          rm -rf .resume-build
          mkdir -p .resume-build
          pdflatex -interaction=nonstopmode -halt-on-error \
            -output-directory=.resume-build \
            resume/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.tex
          test "$(pdfinfo .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf - | \
            grep -q "MCP Agent Security Gateway"

      - name: Synchronize tracked PDF on same-repository pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if cmp -s .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf; then
            echo "Tracked resume PDF already matches the TeX source."
            exit 0
          fi
          cp .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf \
            public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf
          git commit -m "build: refresh resume PDF from TeX source"
          AUTH_HEADER=$(printf "x-access-token:%s" "$GITHUB_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push https://github.com/${GITHUB_REPOSITORY}.git HEAD:${{ github.head_ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify tracked PDF matches TeX source
        run: cmp .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf public/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf

      - name: Upload compiled resume evidence
        if: always()
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: compiled-resume
          path: .resume-build/Pooja_Kiran_Agentic_AI_Security_Engineer_Resume.pdf
          retention-days: 14
