name: Verify Portfolio Resume PDFs

on:
  pull_request:
    branches: [main]
    paths:
      - "public/*Resume.pdf"
      - ".github/workflows/build-resume.yml"
  push:
    branches: [main]
    paths:
      - "public/*Resume.pdf"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-resumes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Verify the published PDF files
        run: |
          pdfinfo public/Pooja_Kiran_TPM_Resume.pdf
          pdfinfo public/Pooja_Kiran_Software_Engineer_Resume.pdf
          pdfinfo public/Pooja_Kiran_Security_Engineer_Resume.pdf
          python3 scripts/verify_recruiter_claims.py
