name: Build One-Page Software Engineer Resume
on:
  pull_request:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"
  push:
    branches: [main]
    paths:
      - "resume/**"
      - ".github/workflows/build-resume.yml"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended texlive-xetex fonts-crosextra-carlito poppler-utils
          mkdir -p .resume-build
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=.resume-build resume/Pooja_Kiran_Software_Engineer_Resume.tex
          test "$(pdfinfo .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf | awk '/^Pages:/ {print $2}')" = "1"
          pdftotext .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf - | grep -q "Technical Skills"
      - name: Prepare PDF publication branch
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf public/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/resume-pdf-${{ github.sha }}
          git add public/Pooja_Kiran_Software_Engineer_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified one-page resume PDF"
            git push -u origin HEAD
            gh pr create --base main --head automation/resume-pdf-${{ github.sha }} --title "Publish verified one-page resume PDF" --body "Generated from the one-page resume source. PDF page count and text extraction checked."
          fi
      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808
        with:
          name: one-page-software-engineer-resume
          path: .resume-build/Pooja_Kiran_Software_Engineer_Resume.pdf
