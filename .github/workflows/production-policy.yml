name: Documentation Integrity

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  documentation-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Check tracked documentation for unresolved conflict markers
        run: |
          python - <<'PY'
          from pathlib import Path
          candidates = [Path("README.md")]
          markers = ("<<<<<<<", ">>>>>>>", "TODO: FILL", "TBD_METRIC")
          failures = []
          for path in candidates:
              if not path.is_file():
                  continue
              body = path.read_text(encoding="utf-8", errors="replace")
              for marker in markers:
                  if marker in body:
                      failures.append(f"{path}: unresolved marker {marker!r}")
          if failures:
              raise SystemExit("\n".join(failures))
          print("documentation integrity verified")
          PY
