name: Build and Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-security-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Dependency security review
        run: |
          npm audit --json > audit-report.json || true
          node scripts/review-audit-report.mjs
      - name: Evidence consistency
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run type-check
      - name: Static production export
        run: npm run build
      - name: Export semantics and asset integrity
        run: node scripts/check-export.mjs
